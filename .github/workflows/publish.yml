# Builds all platform plugins from source on CI, then publishes them as a GitHub
# release. macOS/iOS/Android now compile on macOS runners; win32 stays on Windows.
# No prebuilt binaries are committed — the publish-release job collects everything
# from artifacts injected into the plugins/ tree.

name: publish

on:
  push:
    paths:
      - 'plugins/**'
      - 'docs/**'
      - 'src/**'
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_BUILD: '2025.3720'

jobs:
  # ── macOS dylib ───────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: brew install nasm

      - name: Build third-party libs
        run: cd src/mac && bash build_third_party_libs.sh

      - name: Build plugin_webm.dylib
        run: |
          mkdir -p /tmp/mac-out
          mkdir -p "$HOME/Library/Application Support/Corona/Simulator/Plugins"
          cd src/mac && bash build.sh /tmp/mac-out

      - uses: actions/upload-artifact@v4
        with:
          name: mac-sim
          path: /tmp/mac-out/plugin_webm.dylib
          if-no-files-found: error

  # ── iOS device + simulator static libs ────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: brew install nasm

      - name: Build third-party libs
        run: cd src/ios && bash build_thrid_party_libs.sh

      - name: Build plugin .a + tgz
        run: cd src/ios && bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: |
            plugins/${{ env.PLUGIN_BUILD }}/iphone/
            plugins/${{ env.PLUGIN_BUILD }}/iphone-sim/
          if-no-files-found: error

  # ── Android .so ───────────────────────────────────────────────────────────
  build-android:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download Corona.aar
        run: |
          curl -sL -o /tmp/CoronaCards-Android.zip \
            "https://github.com/coronalabs/corona/releases/download/3720/CoronaCards-Android-2025.3720.zip"
          mkdir -p /Applications/CoronaEnterprise/Corona/android/lib/gradle
          unzip -q /tmp/CoronaCards-Android.zip "CoronaCards.aar" -d /tmp/CoronaCards-Android
          cp /tmp/CoronaCards-Android/CoronaCards.aar \
             /Applications/CoronaEnterprise/Corona/android/lib/gradle/Corona.aar
          ls -lh /Applications/CoronaEnterprise/Corona/android/lib/gradle/Corona.aar

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build third-party libs
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: cd src/android && bash build_thrid_party_libs.sh

      - name: Build plugin .so + tgz
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: cd src/android && bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: |
            plugins/${{ env.PLUGIN_BUILD }}/android/
          if-no-files-found: error

  # ── Windows DLL ──────────────────────────────────────────────────────────
  build-win32:
    runs-on: windows-2022
    env:
      SOLAR2D_YEAR: '2025'
      SOLAR2D_BUILD: '3720'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download + install Solar2D (Corona Native SDK)
        shell: pwsh
        run: |
          $url = "https://github.com/coronalabs/corona/releases/download/$env:SOLAR2D_BUILD/Solar2D-Windows-$env:SOLAR2D_YEAR.$env:SOLAR2D_BUILD.msi"
          Write-Host "Downloading $url"
          curl.exe -L --fail -o solar2d.msi $url
          if (-not (Test-Path solar2d.msi)) { throw "Solar2D MSI download failed" }
          Write-Host "Installing silently..."
          $p = Start-Process msiexec.exe -ArgumentList '/i','solar2d.msi','/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }

      - name: Locate Native SDK and export CORONA_ROOT
        shell: pwsh
        run: |
          $roots = @('C:\Program Files (x86)','C:\Program Files')
          $lib = Get-ChildItem $roots -Recurse -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\Corona\\win\\lib$' } |
                 Select-Object -First 1
          if (-not $lib) {
            Write-Host "Could not find Corona\win\lib. Dumping install tree:"
            Get-ChildItem 'C:\Program Files (x86)\Corona Labs' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Corona Native SDK win\lib not found after install"
          }
          $root = $lib.Parent.Parent.Parent.FullName
          Write-Host "CORONA_ROOT=$root"
          "CORONA_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: msys2/setup-msys2@v2
        with:
          release: false
          install: >-
            make perl diffutils nasm yasm

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build third-party libs (opus, webm, vpx)
        shell: pwsh
        env:
          MSYS2_PATH_TYPE: inherit
        run: ./src/win32/build_thrid_party_libs.ps1

      - name: Build plugin_webm.dll (msbuild, Release/Win32)
        shell: pwsh
        run: msbuild src\win32\Plugin.sln /p:Configuration=Release /p:Platform=Win32 /m /p:PostBuildEventUseInBuild=false

      - name: Stage win32-sim artifact
        shell: pwsh
        run: |
          $dll = "src\win32\Release\plugin_webm.dll"
          if (-not (Test-Path $dll)) { $dll = "src\win32\Win32\Release\plugin_webm.dll" }
          if (-not (Test-Path $dll)) {
            Write-Host "Searching for plugin_webm.dll:"
            Get-ChildItem src\win32 -Recurse -Filter plugin_webm.dll -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "plugin_webm.dll not found after build"
          }
          New-Item -ItemType Directory -Force -Path staging\win32-sim | Out-Null
          Copy-Item $dll staging\win32-sim\plugin_webm.dll

      - uses: actions/upload-artifact@v4
        with:
          name: win32-sim
          path: staging/win32-sim/plugin_webm.dll
          if-no-files-found: error

  # ── Publish Release ──────────────────────────────────────────────────────
  publish-release:
    needs: [build-macos, build-ios, build-android, build-win32]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inject freshly built binaries into plugins/ tree
      - uses: actions/download-artifact@v4
        with:
          name: mac-sim
          path: plugins/${{ env.PLUGIN_BUILD }}/mac-sim

      - uses: actions/download-artifact@v4
        with:
          name: ios-binaries
          path: plugins/${{ env.PLUGIN_BUILD }}

      - uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: plugins/${{ env.PLUGIN_BUILD }}

      - uses: actions/download-artifact@v4
        with:
          name: win32-sim
          path: plugins/${{ env.PLUGIN_BUILD }}/win32-sim

      - name: Show plugins tree to be published
        run: find plugins -type f -not -name '.DS_Store' | sort

      - name: Package each platform into <build>-<platform>.tgz
        run: |
          cd plugins
          for build in */; do
            build="${build%/}"
            ( cd "$build"
              for platform in */; do
                platform="${platform%/}"
                ( cd "$platform"
                  ls * >/dev/null 2>&1 || exit 0
                  tar -czvf ../../"$build-$platform.tgz" --exclude=".*" *
                )
              done
            )
          done
          echo "Produced:"; ls -la *.tgz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: plugins/*.tgz
          name: Release v3
          tag_name: v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Request Solar2D directory update
        shell: bash
        env:
          ISSUE_PAT: ${{ secrets.ISSUE_PAT }}
        run: |
          if [ -z "$ISSUE_PAT" ]; then echo "No ISSUE_PAT secret; skipping directory update."; exit 0; fi
          curl --request POST \
            --url https://api.github.com/repos/solar2d/plugins.solar2d.com/dispatches \
            --header "authorization: Bearer $ISSUE_PAT" \
            --header 'content-type: application/json' \
            --data "{\"event_type\":\"repo_updated\",\"client_payload\":{\"repo\":\"${{ github.repository }}\"}}"
